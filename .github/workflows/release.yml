name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Check common Go mistakes
        run: go vet ./...

      - name: Build macOS binaries
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GOOS: darwin
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/arm64 dist/amd64
          GOARCH=arm64 go build -trimpath -ldflags="-X main.version=${RELEASE_TAG}" -o dist/arm64/portman .
          GOARCH=amd64 go build -trimpath -ldflags="-X main.version=${RELEASE_TAG}" -o dist/amd64/portman .

      - name: Package binaries
        run: |
          cp LICENSE dist/arm64/LICENSE
          cp LICENSE dist/amd64/LICENSE
          tar -czf dist/portman_darwin_arm64.tar.gz -C dist/arm64 portman LICENSE
          tar -czf dist/portman_darwin_amd64.tar.gz -C dist/amd64 portman LICENSE
          cd dist
          shasum -a 256 portman_darwin_*.tar.gz > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/portman_darwin_arm64.tar.gz \
            dist/portman_darwin_amd64.tar.gz \
            dist/checksums.txt \
            --verify-tag \
            --title "Portman $RELEASE_TAG" \
            --generate-notes

  update-homebrew:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
