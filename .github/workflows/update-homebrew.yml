name: Update Homebrew

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to package
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, such as v0.2.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-tap:
    runs-on: macos-latest
    steps:
      - name: Check out Portman
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: arps18/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          persist-credentials: false

      - name: Check release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo arps18/portman \
            --json tagName,isDraft,isPrerelease

      - name: Download and verify release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo arps18/portman \
            --pattern "portman_darwin_arm64.tar.gz" \
            --pattern "portman_darwin_amd64.tar.gz" \
            --pattern "checksums.txt" \
            --dir release-assets

          cd release-assets
          shasum -a 256 -c checksums.txt
